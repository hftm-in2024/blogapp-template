<mat-card class="blog-card" appearance="outlined">
  <img mat-card-image [src]="imageUrl()" [alt]="model().title" loading="lazy" />

  <mat-card-header class="blog-card__header">
    <mat-card-title>{{ model().title }}</mat-card-title>
    <mat-card-subtitle>
      von {{ model().author }} · {{ model().createdAt | date: 'dd.MM.yyyy' }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="blog-card__preview">{{ model().contentPreview }}</p>
  </mat-card-content>

  <mat-card-actions class="blog-card__actions">
    <button
      matIconButton
      type="button"
      [class.blog-card__like--active]="model().likedByMe"
      [attr.aria-label]="model().likedByMe ? 'Like entfernen' : 'Liken'"
      (click)="onLike()"
    >
      <mat-icon>{{ model().likedByMe ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>
    <span class="like-count">{{ model().likes }}</span>

    <span class="blog-card__meta" [attr.aria-label]="model().comments + ' Kommentare'">
      <mat-icon>chat_bubble_outline</mat-icon>
      <span>{{ model().comments }}</span>
    </span>

    <span class="spacer"></span>
    <a matButton [routerLink]="['/blog', model().id]">
      Weiterlesen
      <mat-icon iconPositionEnd>arrow_forward</mat-icon>
    </a>
  </mat-card-actions>
</mat-card>
