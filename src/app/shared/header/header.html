<mat-toolbar class="app-header">
  @if (isMobile()) {
    <button mat-icon-button type="button" aria-label="Menü umschalten" (click)="menuToggle.emit()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a class="app-header__brand" routerLink="/">
    <mat-icon class="app-header__logo">auto_stories</mat-icon>
    <span class="app-header__title">{{ title() }}</span>
  </a>

  <span class="spacer"></span>

  @if (!isMobile()) {
    <nav class="nav-links">
      <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
        >Übersicht</a
      >
      <a routerLink="/about" routerLinkActive="active-link">Über uns</a>
      @if (authEnabled && authStore.isAuthenticated()) {
        <a routerLink="/add-blog" routerLinkActive="active-link" data-testid="add-blog-link"
          >Neuer Beitrag</a
        >
      }
    </nav>
  }

  <span class="app-header__divider" aria-hidden="true"></span>

  @if (authEnabled) {
    @if (authStore.loading()) {
      <!-- session check still running -->
    } @else if (authStore.isAuthenticated()) {
      <span
        class="app-header__avatar"
        data-testid="username"
        [matTooltip]="loggedInHint()"
        [attr.aria-label]="loggedInHint()"
        >{{ initials() }}</span
      >
      <button
        matButton
        type="button"
        data-testid="logout-button"
        matTooltip="Abmelden"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    } @else {
      <a matButton="filled" data-testid="login-link" routerLink="/login">
        <mat-icon>login</mat-icon>
        Login
      </a>
    }
  }

  <button
    mat-icon-button
    class="theme-toggle"
    (click)="themeToggle.emit()"
    [matTooltip]="isDarkMode() ? 'Light Mode aktivieren' : 'Dark Mode aktivieren'"
    [attr.aria-label]="isDarkMode() ? 'Light Mode aktivieren' : 'Dark Mode aktivieren'"
  >
    <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>
