@if (blog(); as post) {
  <mat-card class="blog-detail" appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ post.title }}</mat-card-title>
      <mat-card-subtitle>von {{ post.author }}</mat-card-subtitle>
    </mat-card-header>

    @if (post.headerImageUrl) {
      <img mat-card-image [src]="post.headerImageUrl" [alt]="post.title" />
    }

    <mat-card-content>
      <p>{{ post.content }}</p>
    </mat-card-content>
  </mat-card>
} @else {
  <p class="not-found">Kein Blog-Post mit der ID {{ id() }} gefunden.</p>
}
