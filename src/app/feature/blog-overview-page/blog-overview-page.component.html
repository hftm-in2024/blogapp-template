<section class="overview-page">
  <div class="page-header">
    <p class="eyebrow">IN353 Blog-App</p>
    <h1>Blog-Übersicht</h1>
    <p>Beiträge aus dem Kursprojekt, sauber aufgeteilt in Page, Card und Service.</p>
  </div>

  <div class="blog-grid">
    @for (blog of blogs; track blog.id) {
      <app-blog-card [model]="blog" (liked)="onBlogLiked($event)" />
    } @empty {
      <p class="empty-state">Keine Blog-Posts vorhanden.</p>
    }
  </div>
</section>
